services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freelancecrm
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: freelance_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelance -d freelancecrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: freelancecrm
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: freelance_dev_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
